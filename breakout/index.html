<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Breakout - 1976 Atari Classic</title>
  <meta name="description" content="Authentic 1976 Breakout paddle-ball arcade classic with 2D angular deflection, colored brick tiers, and Web Audio.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="crt.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="arcade-cabinet">
    <!-- Header -->
    <header class="cabinet-header">
      <div class="title-group">
        <h1 class="cabinet-title">🧱 BREAKOUT</h1>
        <span class="badge-year">1976</span>
      </div>
      <div class="header-actions">
        <button id="btn-sound" class="icon-btn">🔊 Sound</button>
        <button id="btn-crt" class="icon-btn">📺 CRT</button>
      </div>
    </header>

    <!-- Scoreboard Dashboard -->
    <section class="metrics-panel">
      <div class="metric-box">
        <span class="metric-label">SCORE</span>
        <span id="stat-score" class="metric-val">0</span>
      </div>
      <div class="metric-box">
        <span class="metric-label">HIGH</span>
        <span id="stat-high" class="metric-val">0</span>
      </div>
      <div class="metric-box">
        <span class="metric-label">LIVES</span>
        <span id="stat-lives" class="metric-val" style="letter-spacing: 2px;">❤️❤️❤️</span>
      </div>
    </section>

    <!-- Canvas Arcade Arena -->
    <main class="arena-well">
      <div class="canvas-wrapper">
        <canvas id="breakout-canvas"></canvas>
        <div id="game-overlay" class="game-overlay" style="display: none;">
          <div id="overlay-msg" class="overlay-title">GAME OVER</div>
          <div class="overlay-actions">
            <button id="btn-play-again" onclick="document.getElementById('btn-restart').click()" class="btn-primary">Play Again ➔</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Control Actions Bar -->
    <div class="actions-row">
      <button id="btn-launch" class="action-btn btn-highlight">🚀 Launch</button>
      <button id="btn-restart" class="action-btn">🔄 Reset (R)</button>
      <button id="btn-vault" class="action-btn">🏆 Vault</button>
      <a href="../index.html" id="btn-portal" class="action-btn">🏛️ Arcade</a>
    </div>

    <!-- Virtual Touch Keypad for Mobile -->
    <div class="touch-bar">
      <button id="btn-left" class="pad-btn" aria-label="Left">◀ LEFT</button>
      <button id="btn-right" class="pad-btn" aria-label="Right">RIGHT ▶</button>
    </div>
  </div>

  <script type="module">
    import { BreakoutUI } from './src/ui.js';
    window.addEventListener('DOMContentLoaded', () => new BreakoutUI());
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
