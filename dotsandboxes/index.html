<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dots and Boxes - La Pipopipette (1889)</title>
  <meta name="description" content="Classic 1889 Dots and Boxes combinatorial strategy game with smart AI, blueprint aesthetic, and offline PWA support.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="crt.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-shell">
    <!-- Unified Header -->
    <header class="arcade-unified-header">
      <div class="header-left">
        <a href="../index.html" id="btn-portal" class="icon-nav-btn" aria-label="Arcade Portal" title="Arcade Portal">🏛️</a>
      </div>
      <div class="title-group">
        <h1 class="header-game-title">📦 DOTS & BOXES</h1>
        <span class="header-badge-year">1889</span>
      </div>
      <div class="header-right">
        <button id="btn-help" class="icon-nav-btn" aria-label="How to Play" title="How to Play">❓</button>
        <button id="btn-options" class="icon-nav-btn" aria-label="Options" title="Game Options">⚙️</button>
        <button id="btn-vault" class="icon-nav-btn" aria-label="Arcade Vault" title="Vault & Achievements">🏆</button>
      </div>
    </header>

    <!-- Scoreboard -->
    <section class="scoreboard">
      <div id="card-p1" class="player-card card-p1 active-turn">
        <div class="player-info">
          <span class="player-name">Player 1</span>
          <span class="turn-pill">Blue</span>
        </div>
        <div id="score-p1" class="player-score">0</div>
      </div>
      <div id="card-p2" class="player-card card-p2">
        <div class="player-info">
          <span id="name-p2" class="player-name">CPU / AI</span>
          <span class="turn-pill">Coral</span>
        </div>
        <div id="score-p2" class="player-score">0</div>
      </div>
    </section>

    <!-- Interactive Blueprint Arena -->
    <main class="board-arena">
      <svg id="svg-board" xmlns="http://www.w3.org/2000/svg" role="grid" aria-label="Dots and Boxes Grid"></svg>
    </main>

    <!-- Status Banner -->
    <div id="status-banner" class="status-banner" role="status">Player 1 draws first.</div>

    <!-- Actions -->
    <div class="action-row">
      <button id="btn-undo" class="action-btn">↩️ Undo</button>
      <button id="btn-restart" class="action-btn btn-primary">🔄 New Game</button>
    </div>
  </div>

  <script type="module">
    import { DotsAndBoxesUI } from './src/ui.js';
    window.addEventListener('DOMContentLoaded', () => new DotsAndBoxesUI());
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
