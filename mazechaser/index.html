<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="The legendary 1980 arcade maze classic: 4 algorithmic ghost AIs, energizers, and fruit bonuses.">
  <title>Maze Chaser (1980) - RPDevs Retro Arcade</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="crt.css">
  <link rel="manifest" href="manifest.json">
</head>
<body class="crt-enabled">
  <div class="game-wrapper">
    <!-- Header -->
    <header class="game-header">
      <div class="header-left">
        <a href="../index.html" class="btn-back" title="Back to Arcade">◀ Arcade</a>
        <h1 class="game-title">🍒 MAZE CHASER <span class="year-badge">1980</span></h1>
      </div>
      <div class="header-actions">
        <button id="btn-sound" class="btn-tool" aria-label="Toggle Sound">🔊 Sound</button>
        <button id="btn-crt" class="btn-tool" aria-label="Toggle CRT Filter">📺 CRT</button>
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">SCORE</span>
        <span id="stat-score" class="stat-val">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">LIVES</span>
        <span id="stat-lives" class="stat-val">💛 💛 💛</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">PELLETS</span>
        <span id="stat-pellets" class="stat-val">0</span>
      </div>
    </div>

    <!-- Main Game Canvas Container -->
    <main class="canvas-wrapper">
      <canvas id="game-canvas"></canvas>

      <!-- Pause Overlay -->
      <div id="pause-overlay" class="overlay" style="display: none;">
        <div class="overlay-card">
          <h2>⏸ PAUSED</h2>
          <p>Game is paused</p>
          <button id="btn-resume" class="btn-modal-action">Resume</button>
        </div>
      </div>

      <!-- Game Over Overlay -->
      <div id="game-over-overlay" class="overlay" style="display: none;">
        <div class="overlay-card">
          <h2>💥 GAME OVER</h2>
          <p class="final-score-text">Final Score: <span id="final-score">0</span></p>
          <button id="btn-restart" class="btn-modal-action">Play Again</button>
        </div>
      </div>

      <!-- Victory Overlay -->
      <div id="victory-overlay" class="overlay" style="display: none;">
        <div class="overlay-card">
          <h2>🏆 MAZE CLEARED!</h2>
          <p class="final-score-text">Final Score: <span id="win-score">0</span></p>
          <button id="btn-win-restart" class="btn-modal-action">Play Again</button>
        </div>
      </div>
    </main>

    <!-- Quick Tools -->
    <div class="quick-tools">
      <button id="btn-pause" class="btn-tool-sm">⏸ Pause (P)</button>
      <button id="btn-reset" class="btn-tool-sm">🔄 Reset (R)</button>
    </div>

    <!-- On-screen Touch Controls for Mobile -->
    <section class="touch-controls">
      <div class="dpad-grid">
        <div class="dpad-empty"></div>
        <button id="btn-up" class="btn-dpad" aria-label="Move Up">▲</button>
        <div class="dpad-empty"></div>

        <button id="btn-left" class="btn-dpad" aria-label="Move Left">◀</button>
        <div class="dpad-center">●</div>
        <button id="btn-right" class="btn-dpad" aria-label="Move Right">▶</button>

        <div class="dpad-empty"></div>
        <button id="btn-down" class="btn-dpad" aria-label="Move Down">▼</button>
        <div class="dpad-empty"></div>
      </div>
    </section>
  </div>

  <!-- Shared Arcade Infrastructure -->
  <script type="module" src="arcade_vault.js"></script>
  <script type="module" src="crt.js"></script>
  <script type="module" src="gamepad.js"></script>
  <script type="module" src="src/ui.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
