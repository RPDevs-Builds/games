<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Mathematical sliding block number puzzle: merge powers of two with touch swipes, undo, and endless mode.">
  <title>2048 - Classic Number Sliding Game</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="crt.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <!-- Header -->
    <header class="arcade-unified-header" style="margin-bottom: 8px;">
      <a href="../index.html" id="btn-portal" class="arcade-btn-icon" title="Arcade Portal" aria-label="Arcade Portal">🏛️</a>
      <h1 class="arcade-header-title">🔢 2048</h1>
      <div class="arcade-header-actions">
        <button id="btn-help" class="arcade-btn-icon" title="How to Play" aria-label="How to Play">❓</button>
        <button id="btn-options" class="arcade-btn-icon" title="Options" aria-label="Options">⚙️</button>
        <button id="btn-vault" class="arcade-btn-icon" title="Vault & Trophies" aria-label="Vault">🏆</button>
      </div>
    </header>

    <div class="header-row">
      <div style="font-size: 0.9rem; color: #776e65; font-weight: bold;">Merge tiles to reach <strong>2048!</strong></div>
      <div class="scores-container">
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span id="score-val" class="score-val">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">BEST</span>
          <span id="best-val" class="score-val">0</span>
        </div>
      </div>
    </div>

    <div class="controls-row" style="margin-bottom: 12px; display: flex; gap: 8px; justify-content: space-between;">
      <button id="btn-undo" class="btn" style="padding: 8px 16px; flex: 1;">↩️ Undo</button>
      <button id="btn-new" class="btn" style="padding: 8px 16px; flex: 1;">New Game</button>
    </div>

    <!-- Board -->
    <div style="position: relative;">
      <div id="grid" class="grid-container"></div>
      <div id="overlay" class="game-overlay" style="display: none;">
        <div id="overlay-msg">GAME OVER</div>
        <div style="display: flex; gap: 8px;">
          <button id="btn-continue" class="btn" style="display: none;">Keep Going</button>
          <button onclick="document.getElementById('btn-new').click()" class="btn">Try Again</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { Game2048UI } from './src/ui.js';
    window.addEventListener('DOMContentLoaded', () => new Game2048UI());
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
