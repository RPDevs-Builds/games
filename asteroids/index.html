<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Asteroids - 1979 Atari Arcade Classic</title>
  <meta name="description" content="Authentic 1979 Atari Asteroids vector arcade classic with 360° rotational inertia, procedural polygon asteroids, alien saucers, and Web Audio.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="crt.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="arcade-cabinet">
    <!-- Header -->
    <header class="arcade-unified-header">
      <a href="../index.html" id="btn-portal" class="arcade-btn-icon" title="Arcade Portal" aria-label="Arcade Portal">🏛️</a>
      <h1 class="arcade-header-title">🚀 ASTEROIDS</h1>
      <div class="arcade-header-actions">
        <button id="btn-help" class="arcade-btn-icon" title="How to Play" aria-label="How to Play">❓</button>
        <button id="btn-options" class="arcade-btn-icon" title="Options" aria-label="Options">⚙️</button>
        <button id="btn-vault" class="arcade-btn-icon" title="Vault & Trophies" aria-label="Vault">🏆</button>
      </div>
    </header>

    <!-- Scoreboard Dashboard -->
    <section class="metrics-panel">
      <div class="metric-box">
        <span class="metric-label">SCORE</span>
        <span id="stat-score" class="metric-val">0</span>
      </div>
      <div class="metric-box">
        <span class="metric-label">HIGH</span>
        <span id="stat-high-score" class="metric-val">0</span>
      </div>
      <div class="metric-box">
        <span class="metric-label">WAVE</span>
        <span id="stat-wave" class="metric-val">1</span>
      </div>
      <div class="metric-box">
        <span class="metric-label">SHIPS</span>
        <div id="lives-container" class="lives-box"></div>
      </div>
    </section>

    <!-- Canvas Arcade Arena -->
    <main class="arena-well">
      <div class="canvas-wrapper">
        <canvas id="asteroids-canvas"></canvas>
        <div id="game-overlay" class="game-overlay" style="display: none;">
          <div id="overlay-title" class="overlay-title">GAME OVER</div>
          <div id="overlay-score" class="overlay-sub">FINAL SCORE: 0</div>
          <div class="overlay-actions">
            <button id="btn-play-again" onclick="document.getElementById('btn-restart').click()" class="btn-primary">Play Again (Space) ➔</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Control Actions Bar -->
    <div class="actions-row">
      <button id="btn-restart" class="action-btn">🔄 Reset (R)</button>
    </div>

    <!-- Mobile Virtual Touch Controls -->
    <div class="touch-bar">
      <div class="touch-group-left">
        <button id="btn-touch-left" class="pad-btn" aria-label="Rotate Left">◀ TURN</button>
        <button id="btn-touch-right" class="pad-btn" aria-label="Rotate Right">TURN ▶</button>
      </div>
      <div class="touch-group-right">
        <button id="btn-touch-thrust" class="pad-btn btn-thrust" aria-label="Thrust">🚀 THRUST</button>
        <button id="btn-touch-fire" class="pad-btn btn-fire" aria-label="Fire">⚡ FIRE</button>
        <button id="btn-touch-hyper" class="pad-btn btn-hyper" aria-label="Hyperspace">🌀 HYPER</button>
      </div>
    </div>
  </div>

  <!-- Shared Arcade Infrastructure -->
  <script type="module" src="arcade_vault.js"></script>
  <script type="module" src="crt.js"></script>
  <script type="module" src="gamepad.js"></script>
  <script type="module" src="src/ui.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
