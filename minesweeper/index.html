<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Windows 95 deductive logic classic: guaranteed first-click safety, digital LED timer, and flag toggling.">
  <title>Minesweeper - Windows 95 Edition</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="crt.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="win-window">
    <!-- Header -->
    <header class="arcade-unified-header" style="margin-bottom: 8px;">
      <a href="../index.html" id="btn-portal" class="arcade-btn-icon" title="Arcade Portal" aria-label="Arcade Portal">🏛️</a>
      <h1 class="arcade-header-title">💣 MINESWEEPER</h1>
      <div class="arcade-header-actions">
        <button id="btn-help" class="arcade-btn-icon" title="How to Play" aria-label="How to Play">❓</button>
        <button id="btn-options" class="arcade-btn-icon" title="Options" aria-label="Options">⚙️</button>
        <button id="btn-vault" class="arcade-btn-icon" title="Vault & Trophies" aria-label="Vault">🏆</button>
      </div>
    </header>

    <!-- Dashboard -->
    <div class="win-dashboard">
      <div id="display-mines" class="digit-display">010</div>
      <button id="btn-face" class="face-btn">🙂</button>
      <div id="display-timer" class="digit-display">000</div>
    </div>

    <!-- Minefield -->
    <div class="minefield-container">
      <div id="minefield" class="minefield"></div>
    </div>

    <div class="difficulty-bar" style="justify-content: center;">
      <!-- Hidden diff select for backwards compatibility -->
      <select id="select-diff" class="styled-diff" style="display: none;">
        <option value="beginner" selected>Beginner (9x9)</option>
        <option value="intermediate">Intermediate (16x16)</option>
        <option value="expert">Expert (16x30)</option>
      </select>
      <button id="btn-flag-mode" class="styled-flag-btn" style="flex: 1; max-width: 200px;">🚩 Flag: OFF</button>
    </div>
  </div>

  <script type="module">
    import { MinesweeperUI } from './src/ui.js';
    window.addEventListener('DOMContentLoaded', () => new MinesweeperUI());
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
