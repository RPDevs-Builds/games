name: Run Unit Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Test Suites Across All Games
        run: |
          echo "=== Running Unit Tests across all games ==="
          total_passed=0
          for d in */test; do
            echo "----------------------------------------"
            echo "Running test suite in $d"
            python3 -m unittest discover -s "$d"
          done
          echo "========================================"
          echo "All test suites executed successfully!"
