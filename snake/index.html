<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Classic Nokia 3310 monochrome green LCD snake: reflexes, speed progression, and piezoelectric audio.">
  <title>Retro Snake - Nokia 3310 Edition</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="crt.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-casing">
    <div class="brand-badge">NOKIA 3310</div>
    <div class="screen-frame">
      <div class="lcd-screen">
        <div class="lcd-header">
          <span>SCORE: <span id="score-val">0</span></span>
          <span>HIGH: <span id="high-val">0</span></span>
        </div>
        <canvas id="canvas" width="200" height="200"></canvas>
        <div id="overlay" class="screen-overlay">
          <div id="overlay-msg">PRESS START</div>
        </div>
      </div>
    </div>

    <div class="controls-row">
      <button id="btn-restart" class="sub-btn">🎮 Start / Restart</button>
      <button id="btn-pause" class="sub-btn">⏸️ Pause</button>
      <button id="btn-sound" class="sub-btn">🔊 Sound</button>
      <button id="btn-crt" class="sub-btn">📺 CRT</button>
    </div>

    <!-- Retro Keypad / D-Pad -->
    <div class="keypad">
      <div></div>
      <button id="btn-up" class="key-btn" aria-label="Up">▲</button>
      <div></div>
      <button id="btn-left" class="key-btn" aria-label="Left">◀</button>
      <button id="btn-down" class="key-btn" aria-label="Down">▼</button>
      <button id="btn-right" class="key-btn" aria-label="Right">▶</button>
    </div>
  </div>

  <script type="module">
    import { SnakeUI } from './src/ui.js';
    window.addEventListener('DOMContentLoaded', () => {
      new SnakeUI();
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
