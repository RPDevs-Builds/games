<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="1978 Milton Bradley handheld electronic memory game: exact harmonic frequencies and progressive sequences.">
  <title>Simon - 1978 Handheld Classic</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="crt.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="arcade-unified-header" style="width: 100%; max-width: 360px; margin-bottom: 12px;">
    <a href="../index.html" id="btn-portal" class="arcade-btn-icon" title="Arcade Portal" aria-label="Arcade Portal">🏛️</a>
    <h1 class="arcade-header-title">🔴 SIMON</h1>
    <div class="arcade-header-actions">
      <button id="btn-help" class="arcade-btn-icon" title="How to Play" aria-label="How to Play">❓</button>
      <button id="btn-options" class="arcade-btn-icon" title="Options" aria-label="Options">⚙️</button>
      <button id="btn-vault" class="arcade-btn-icon" title="Vault & Trophies" aria-label="Vault">🏆</button>
    </div>
  </header>

  <div class="simon-disc">
    <div class="quadrant-grid">
      <button id="pad-green" class="simon-pad pad-green" aria-label="Green (Q)"></button>
      <button id="pad-red" class="simon-pad pad-red" aria-label="Red (W)"></button>
      <button id="pad-yellow" class="simon-pad pad-yellow" aria-label="Yellow (A)"></button>
      <button id="pad-blue" class="simon-pad pad-blue" aria-label="Blue (S)"></button>
    </div>

    <!-- Center Hub -->
    <div class="center-hub">
      <div class="simon-logo">SIMON</div>
      <div id="count-display" class="led-counter">--</div>
      <div class="hub-controls">
        <button id="btn-start" class="hub-btn">START</button>
        <button id="btn-strict" class="hub-btn">STRICT</button>
      </div>
    </div>
  </div>

  <div id="status-msg" class="status-bar">PRESS START TO PLAY</div>

  <script type="module">
    import { SimonUI } from './src/ui.js';
    window.addEventListener('DOMContentLoaded', () => new SimonUI());
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
