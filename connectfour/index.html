<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Connect Four (4 in a Row) - 1974 Retro Classic</title>
  <meta name="description" content="Classic 1974 Connect Four vertical drop strategy with Minimax Alpha-Beta AI, Pass & Play, tactile physics, and Web Audio.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="crt.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="c4-console">
    <!-- Unified Header -->
    <header class="arcade-unified-header">
      <div class="header-left">
        <a href="../index.html" id="btn-portal" class="icon-nav-btn" aria-label="Arcade Portal" title="Arcade Portal">🏛️</a>
      </div>
      <div class="title-group">
        <h1 class="header-game-title">🔴 CONNECT 4 🟡</h1>
        <span class="header-badge-year">1974</span>
      </div>
      <div class="header-right">
        <button id="btn-help" class="icon-nav-btn" aria-label="How to Play" title="How to Play">❓</button>
        <button id="btn-options" class="icon-nav-btn" aria-label="Options" title="Game Options">⚙️</button>
        <button id="btn-vault" class="icon-nav-btn" aria-label="Arcade Vault" title="Vault & Achievements">🏆</button>
      </div>
    </header>

    <!-- Scoreboard Dashboard -->
    <section class="metrics-panel">
      <div class="metric-box p1-box">
        <span class="metric-label">RED (P1)</span>
        <span id="score-p1" class="metric-val">0</span>
      </div>
      <div class="metric-box status-turn-box">
        <span id="turn-indicator" class="turn-badge p1">Turn: Red</span>
      </div>
      <div class="metric-box p2-box">
        <span class="metric-label">YELLOW (P2)</span>
        <span id="score-p2" class="metric-val">0</span>
      </div>
    </section>

    <!-- Drop Preview Row -->
    <div id="col-drop-preview" class="col-drop-preview" aria-hidden="true">
      <div class="preview-slot">▼</div>
      <div class="preview-slot">▼</div>
      <div class="preview-slot">▼</div>
      <div class="preview-slot active p1">▼</div>
      <div class="preview-slot">▼</div>
      <div class="preview-slot">▼</div>
      <div class="preview-slot">▼</div>
    </div>

    <!-- The Vertical Board Grid -->
    <main class="arena-well">
      <div class="c4-frame">
        <div id="c4-board" class="c4-board" role="grid" aria-label="Connect Four 7 by 6 Grid">
          <!-- Rendered dynamically by ui.js -->
        </div>
      </div>

      <div id="game-overlay" class="game-overlay" style="display: none;">
        <div id="overlay-msg" class="overlay-title">VICTORY!</div>
        <div class="overlay-actions">
          <button id="btn-play-again" class="btn-primary">Play Again ➔</button>
        </div>
      </div>
    </main>

    <!-- Status Banner -->
    <div id="status-banner" class="status-banner" role="status">Your turn (Red). Tap any column to drop.</div>

    <!-- Action Buttons -->
    <div class="actions-row">
      <button id="btn-undo" class="action-btn">↩️ Undo (U)</button>
      <button id="btn-reset" class="action-btn">🔄 New Game (R)</button>
    </div>
  </div>

  <script type="module">
    import { ConnectFourUI } from './src/ui.js';
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', () => new ConnectFourUI());
    } else {
      new ConnectFourUI();
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
