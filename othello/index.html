<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Othello (Reversi) - 1883 Classic Strategy</title>
  <meta name="description" content="Authentic Othello / Reversi board game featuring 8x8 tactical disk flipping, Minimax AI with Alpha-Beta pruning, Pass & Play mode, and tactile Web Audio.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="crt.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="othello-container">
    <!-- Header -->
    <!-- Unified Header -->
    <header class="arcade-unified-header">
      <div class="header-left">
        <a href="../index.html" id="btn-portal" class="icon-nav-btn" aria-label="Arcade Portal" title="Arcade Portal">🏛️</a>
      </div>
      <div class="title-group">
        <h1 class="header-game-title">⚪ OTHELLO ⚫</h1>
        <span class="header-badge-year">1883</span>
      </div>
      <div class="header-right">
        <button id="btn-help" class="icon-nav-btn" aria-label="How to Play" title="How to Play">❓</button>
        <button id="btn-options" class="icon-nav-btn" aria-label="Options" title="Game Options">⚙️</button>
        <button id="btn-vault" class="icon-nav-btn" aria-label="Arcade Vault" title="Vault & Achievements">🏆</button>
      </div>
    </header>

    <!-- Scoreboard -->
    <section class="scoreboard">
      <div class="score-box black-box">
        <span class="score-label">Black (P1)</span>
        <span id="score-black" class="score-val">2</span>
      </div>
      <div class="turn-box">
        <span id="turn-badge" class="turn-badge black-turn">● Turn: Black</span>
      </div>
      <div class="score-box white-box">
        <span class="score-label">White (CPU)</span>
        <span id="score-white" class="score-val">2</span>
      </div>
    </section>

    <div id="status-banner" class="status-banner"></div>

    <!-- Quick Actions Bar -->
    <div class="controls-bar" style="justify-content: center; gap: 10px;">
      <button id="btn-hints" class="icon-btn">💡 Hints: ON</button>
      <button id="btn-new" class="icon-btn" style="background: #238636; color: #fff;">🔄 New Game</button>
    </div>

    <!-- 8x8 Board -->
    <div class="board-bezel">
      <main id="board" class="othello-board" aria-label="Othello 8x8 Board"></main>
    </div>
  </div>

  <script type="module">
    import { OthelloUI } from './src/ui.js';
    window.addEventListener('DOMContentLoaded', () => new OthelloUI());
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
